services:
  redis:
    image: redis:7
    # 개발용 메모리 저장소: 재시작하면 세션이 사라져 재로그인해야 한다.
    # 메모리 부족 시 세션을 임의로 축출하지 않고 쓰기를 실패시킨다.
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-askteacher-postgres-data}
