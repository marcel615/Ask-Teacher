# 프로젝트 연결 데이터다. 작업 범위와 결정 권한은 AGENTS.md를 따른다.
schema_version: 2
active_service: askteacher

services:
  askteacher:
    repositories:
      common:
        enabled: true
        repository: marcel615/Ask-Teacher-specs
        default_branch: main
      backend:
        enabled: true
        repository: marcel615/Ask-Teacher
        default_branch: develop

    project:
      owner: marcel615
      number: 1
      id: PVT_kwHOA3_2Ds4BqsK-
      url: https://github.com/users/marcel615/projects/1
      fields:
        status: Status
        approval: Approval
        proposer: Proposer
        candidate_id: Candidate ID
        priority: Priority
        target_date: Target date
      statuses:
        backlog: Backlog
        ready: Ready
        in_progress: In Progress
        in_review: In Review
        done: Done
      approval_values:
        pending: Pending
        approved: Approved
      proposer_values:
        user: User
        ai: AI
      priority_values:
        high: High
        medium: Medium
        low: Low

    labels:
      decision: 'needs: decision'
      priority:
        high: 'priority: high'
        medium: 'priority: medium'
        low: 'priority: low'

    requirements:
      repository_role: common
      path: docs/requirements.md
      format: markdown

    contracts:
      api:
        repository_role: common
        path: docs/api-spec.md
        format: markdown
      erd:
        repository_role: common
        path: docs/erd.md
        format: markdown

    development:
      branch_pattern: 'feature/issue-번호-작업명'
      branch_prefix: 'feature/'
      protected_branches:
        - main
        - develop
      test_command: './gradlew test'
      test_command_windows: '.\gradlew.bat test'

# 명세는 해당 repository_role의 default_branch에서 조회하며 원문을 복사하지 않는다.
# Project 필드·선택지와 라벨은 사용 전 실제 GitHub 값과 대조한다.
# 토큰과 인증 정보는 기록하지 않는다.
