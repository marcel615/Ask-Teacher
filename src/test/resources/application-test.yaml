spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  data:
    redis:
      # 개발용 Redis와 분리된 테스트 인스턴스를 사용한다.
      host: 127.0.0.1
      port: ${TEST_REDIS_PORT:16379}

jwt:
  secret: test-only-q8MzV3RaL5NcH2PtJ7XyK4UwZ9Gf
  expiration: 15m

app:
  auth:
    cookie-secure: false
    csrf-secret: isolated-csrf-test-secret-at-least-32-bytes
  file-storage:
    post-upload-dir: ${java.io.tmpdir}/askteacher-test-${random.uuid}
    max-file-size: 10485760
