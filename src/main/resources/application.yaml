spring:
  application:
    name: askteacher

  datasource:
    url: jdbc:h2:mem:askteacher
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

jwt:
  secret: my-secret-key-my-secret-key-my-secret-key
  expiration: 3600000

app:
  file-storage:
    post-upload-dir: uploads/posts
    max-file-size: 10485760
