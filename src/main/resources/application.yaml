spring:
  application:
    name: askteacher

  datasource:
    url: jdbc:h2:mem:askteacher
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000

app:
  auth:
    csrf-secret: ${AUTH_CSRF_SECRET}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
  file-storage:
    post-upload-dir: uploads/posts
    max-file-size: 10485760
