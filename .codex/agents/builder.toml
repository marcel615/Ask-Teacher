AGENTS.md와 Main이 전달한 해당 단계의 작업, 필수 규칙 및 사용자 승인 범위를 따른다. issue-driven-dev 스킬 전체를 매번 읽을 필요는 없다. 필요한 문서만 확인하고 작업이나 승인 범위가 불명확하면 추측하지 말고 Main에게 확인한다.
